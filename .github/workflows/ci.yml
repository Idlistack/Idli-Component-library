name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Generated files (examples index, package AGENTS.md) must be committed up to date.
      - name: Generated files are committed
        run: |
          npm run gen:examples -w docs
          git diff --exit-code -- apps/docs/examples/index.ts packages/ui/AGENTS.md
